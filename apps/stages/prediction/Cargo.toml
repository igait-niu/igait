[package]
name = "prediction"
version = "0.1.0"
edition = "2021"
description = "ML prediction microservice for iGait pipeline"

[[bin]]
name = "prediction"
path = "src/main.rs"

[dependencies]
lib = { path = "../../shared", features = ["microservice"] }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
