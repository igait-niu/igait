[package]
name = "finalize"
version = "0.1.0"
edition = "2021"
description = "Finalize microservice for iGait pipeline - sends emails and archives results"

[[bin]]
name = "finalize"
path = "src/main.rs"

[dependencies]
lib = { path = "../../shared", features = ["microservice", "email"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
