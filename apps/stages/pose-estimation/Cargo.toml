[package]
name = "pose-estimation"
version = "0.1.0"
edition = "2021"
description = "Pose estimation microservice for iGait pipeline"

[[bin]]
name = "pose-estimation"
path = "src/main.rs"

[dependencies]
lib = { path = "../../shared", features = ["microservice"] }
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
