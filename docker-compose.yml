# iGait Microservices - Queue-based Architecture
# All services are independent workers polling Firebase RTDB queues

x-common-env: &common-env
  # AWS S3 Storage
  AWS_S3_BUCKET: ${AWS_S3_BUCKET:-igait-storage}
  AWS_REGION: ${AWS_REGION:-us-east-2}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  # Firebase RTDB (for queues)
  FIREBASE_RTDB_URL: ${FIREBASE_RTDB_URL:-https://network-technology-project-default-rtdb.firebaseio.com}
  FIREBASE_ACCESS_KEY: ${FIREBASE_ACCESS_KEY}
  RUST_LOG: info

services:
  # Frontend Web Application
  web:
    build:
      context: ./igait-frontend
      dockerfile: Dockerfile
    ports:
      - "4173:4173"
    depends_on:
      - backend

  # Backend API (handles uploads, pushes to the first stage queue)
  backend:
    build:
      context: .
      dockerfile: igait-backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      <<: *common-env
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/gcp-key.json
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_ASSISTANT_ID: ${OPENAI_ASSISTANT_ID}
      OPENAI_VECTOR_STORE_ID: ${OPENAI_VECTOR_STORE_ID}
      PORT: 3000
    volumes:
      - ./credentials:/app/credentials:ro

  # Media Conversion Worker
  media-conversion:
    build:
      context: .
      dockerfile: igait-stages/media-conversion/Dockerfile
    environment:
      <<: *common-env

  # Validity Check Worker
  validity-check:
    build:
      context: .
      dockerfile: igait-stages/validity-check/Dockerfile
    environment:
      <<: *common-env

  # Reframing Worker
  reframing:
    build:
      context: .
      dockerfile: igait-stages/reframing/Dockerfile
    environment:
      <<: *common-env

  # Pose Estimation Worker
  pose-estimation:
    build:
      context: .
      dockerfile: igait-stages/pose-estimation/Dockerfile
    environment:
      <<: *common-env

  # Cycle Detection Worker
  cycle-detection:
    build:
      context: .
      dockerfile: igait-stages/cycle-detection/Dockerfile
    environment:
      <<: *common-env

  # Prediction Worker
  prediction:
    build:
      context: .
      dockerfile: igait-stages/prediction/Dockerfile
    environment:
      <<: *common-env

  # Finalize Worker (sends emails)
  finalize:
    build:
      context: .
      dockerfile: igait-stages/finalize/Dockerfile
    environment:
      <<: *common-env
