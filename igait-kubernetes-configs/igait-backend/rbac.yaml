apiVersion: v1
kind: ServiceAccount
metadata:
  name: igait-backend
  namespace: igait
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: igait-job-manager
  namespace: igait
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: igait-backend-job-manager
  namespace: igait
subjects:
- kind: ServiceAccount
  name: igait-backend
  namespace: igait
roleRef:
  kind: Role
  name: igait-job-manager
  apiGroup: rbac.authorization.k8s.io
