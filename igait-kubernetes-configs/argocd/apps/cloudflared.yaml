apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/igait-niu/igait.git
    targetRevision: master
    path: igait-kubernetes-configs/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: igait
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
