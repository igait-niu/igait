name: Build Backend

on:
  push:
    branches: ['master']
    paths:
      - 'igait-backend/**'
      - 'igait-lib/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/igait-backend

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./igait-backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update deployment image tag
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          git clone https://x-access-token:${DEPLOY_TOKEN}@github.com/igait-niu/igait-kubernetes-configs.git /tmp/k8s-configs
          cd /tmp/k8s-configs
          sed -i "s|image: ghcr.io/igait-niu/igait/igait-backend:.*|image: ghcr.io/igait-niu/igait/igait-backend:sha-${SHA_SHORT}|" igait-backend/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "deploy: igait-backend:sha-${SHA_SHORT}" && git push
