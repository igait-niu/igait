name: Build Stage 2 - Validity Check

on:
  push:
    branches: ['master']
    paths:
      - 'igait-stages/igait-stage2-validity-check/**'
      - 'igait-lib/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-stage2.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/igait-stage2-validity-check

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./igait-stages/igait-stage2-validity-check/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Update deployment image tag
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s|value: ghcr.io/igait-niu/igait/igait-stage2-validity-check:.*|value: ghcr.io/igait-niu/igait/igait-stage2-validity-check:sha-${SHA_SHORT}|" igait-kubernetes-configs/igait-backend/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:igait-niu/igait.git
          git add igait-kubernetes-configs/
          git diff --cached --quiet || git commit -m "deploy: igait-stage2-validity-check:sha-${SHA_SHORT}" && git push
