name: Build Media Conversion

on:
  push:
    branches: ['main']
    paths:
      - 'apps/stages/media-conversion/**'
      - 'apps/shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'infra/docker/workspace/Dockerfile'
      - '.github/workflows/build-media-conversion.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/media-conversion

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/workspace/Dockerfile
          target: media-conversion
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Update deployment image tag
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:igait-niu/igait.git
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            sed -i "s|image: ghcr.io/igait-niu/igait/media-conversion:.*|image: ghcr.io/igait-niu/igait/media-conversion:sha-${SHA_SHORT}|" infra/k8s/stages/media-conversion/deployment.yaml
            git add infra/k8s/
            git diff --cached --quiet && echo "Already up to date" && exit 0
            git commit -m "deploy: media-conversion:sha-${SHA_SHORT}"
            git push origin main && exit 0
          done
          echo "Failed to push after 5 attempts" && exit 1
