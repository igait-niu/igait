apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-2
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-ssm-creds
            key: access-key-id
            namespace: external-secrets
          secretAccessKeySecretRef:
            name: aws-ssm-creds
            key: secret-access-key
            namespace: external-secrets
