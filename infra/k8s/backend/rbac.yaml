apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: igait
# No RoleBinding — backend no longer talks to the Kubernetes API. The
# old `igait-job-manager` Role (verbs on `batch/jobs` + `pods`) was
# only there for the K8s-Job orchestrator that lived in
# apps/backend/src/helper/orchestrator.rs. Stages now run as long-lived
# Deployments under infra/k8s/stages/ instead.
