apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: igait
  labels:
    app: backend
spec:
  revisionHistoryLimit: 1
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      # Upload requests can be multi-MB multipart streams that take tens of
      # seconds over a residential uplink. Axum's `.with_graceful_shutdown`
      # lets in-flight requests finish after SIGTERM; kubelet enforces the
      # outer deadline. 180s covers a typical front+side video pair with
      # headroom. Default 30s truncates uploads mid-stream → 502 at the edge.
      terminationGracePeriodSeconds: 180
      containers:
      - image: ghcr.io/igait-niu/igait/backend:sha-fca3327
        name: backend
        ports:
        - containerPort: 3000
          protocol: TCP
        # Readiness gates rollout traffic: the pod is only added to the
        # Service endpoints once /healthz returns 200. Without this the pod
        # is "Ready" the instant the container starts, which races ahead of
        # the axum listener binding. Failures also deregister the pod from
        # the Service without killing it — useful for transient unhealthy
        # states that shouldn't trigger a restart loop.
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        # Liveness is more conservative than readiness: a failure restarts
        # the pod, so we want high tolerance to avoid flapping during slow
        # GC pauses, disk stalls, or upstream hiccups that block the async
        # runtime briefly.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        # Give the Endpoints controller time to deregister this pod from the
        # Service before the process stops accepting connections. Without it,
        # cloudflared (and any other client) can still route new requests to
        # a terminating pod for ~1–2s → connection refused races.
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sleep", "5"]
        env:
        # Per-service runtime config (not a shared secret)
        - name: PORT
          value: "3000"
        - name: RUST_LOG
          value: "info"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          valueFrom:
            secretKeyRef:
              name: igait-secrets
              key: GOOGLE_APPLICATION_CREDENTIALS
        - name: FIREBASE_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: igait-secrets
              key: FIREBASE_PROJECT_ID
        - name: FIREBASE_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: igait-secrets
              key: FIREBASE_ACCESS_KEY
        - name: FIREBASE_RTDB_URL
          valueFrom:
            secretKeyRef:
              name: igait-secrets
              key: FIREBASE_RTDB_URL
        - name: IGAIT_S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: igait-secrets
              key: IGAIT_S3_BUCKET
        - name: SES_FROM_ADDRESS
          valueFrom:
            secretKeyRef:
              name: igait-secrets
              key: SES_FROM_ADDRESS
        - name: SES_FROM_IDENTITY_ARN
          valueFrom:
            secretKeyRef:
              name: igait-secrets
              key: SES_FROM_IDENTITY_ARN
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: igait-secrets
              key: AWS_REGION
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: igait-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: igait-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: igait-secrets
              key: OPENAI_API_KEY
        - name: OPENAI_ASSISTANT_ID
          valueFrom:
            secretKeyRef:
              name: igait-secrets
              key: OPENAI_ASSISTANT_ID
        - name: OPENAI_VECTOR_STORE_ID
          valueFrom:
            secretKeyRef:
              name: igait-secrets
              key: OPENAI_VECTOR_STORE_ID
        # Pipeline orchestrator
        - name: ENABLE_ORCHESTRATOR
          value: "true"
        # Stage container images (updated by CI/CD). Env var keys are
        # STAGE_<UPPER_SNAKE_KEY>_IMAGE; values track the ghcr image
        # tag for each stage and are sed-patched by the per-stage
        # build workflows on every push to main.
        - name: STAGE_MEDIA_CONVERSION_IMAGE
          value: ghcr.io/igait-niu/igait/media-conversion:sha-e530730
        - name: STAGE_POSE_ESTIMATION_IMAGE
          value: ghcr.io/igait-niu/igait/pose-estimation:sha-e530730
        - name: STAGE_CYCLE_DETECTION_IMAGE
          value: ghcr.io/igait-niu/igait/cycle-detection:sha-e530730
        - name: STAGE_PREDICTION_IMAGE
          value: ghcr.io/igait-niu/igait/prediction:sha-e530730
        - name: STAGE_FINALIZE_IMAGE
          value: ghcr.io/igait-niu/igait/finalize:sha-e530730
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
            ephemeral-storage: 256Mi
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 64Mi
        volumeMounts:
        - name: gcp-key
          mountPath: /credentials
          readOnly: true
      volumes:
      - name: gcp-key
        secret:
          secretName: gcp-key