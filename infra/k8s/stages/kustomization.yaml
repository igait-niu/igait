apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Long-lived worker Deployments — one per pipeline stage. Replaces the old
# K8s-Job-spawning orchestrator that lived in apps/backend/src/helper/.
# Each stage runs run_stage_worker() from apps/shared/src/microservice/worker.rs
# and polls Firebase RTDB queues directly.

resources:
  - serviceaccount.yaml
  - media-conversion/deployment.yaml
  - pose-estimation/deployment.yaml
  - cycle-detection/deployment.yaml
  - prediction/deployment.yaml
  - finalize/deployment.yaml
