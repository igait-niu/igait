# Long-lived worker for the prediction stage. See
# infra/k8s/stages/media-conversion/deployment.yaml for the architectural
# header — every stage Deployment shares the same shape.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction
  namespace: igait
  labels:
    app: prediction
    igait.niu.edu/stage: prediction
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: prediction
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: prediction
        igait.niu.edu/stage: prediction
    spec:
      serviceAccountName: stage-worker
      # Per-job timeout is 600s; +60s slack for graceful SIGTERM.
      terminationGracePeriodSeconds: 660
      containers:
      - name: prediction
        image: ghcr.io/igait-niu/igait/prediction:sha-e530730
        env:
        - name: RUST_LOG
          value: "info"
        envFrom:
        - secretRef:
            name: igait-secrets
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
