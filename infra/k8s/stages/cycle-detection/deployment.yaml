# Long-lived worker for the cycle-detection stage. See
# infra/k8s/stages/media-conversion/deployment.yaml for the architectural
# header — every stage Deployment shares the same shape.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cycle-detection
  namespace: igait
  labels:
    app: cycle-detection
    igait.niu.edu/stage: cycle-detection
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: cycle-detection
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cycle-detection
        igait.niu.edu/stage: cycle-detection
    spec:
      serviceAccountName: stage-worker
      # Per-job timeout is 1800s; +60s slack for graceful SIGTERM.
      terminationGracePeriodSeconds: 1860
      containers:
      - name: cycle-detection
        image: ghcr.io/igait-niu/igait/cycle-detection:sha-e530730
        env:
        - name: RUST_LOG
          value: "info"
        envFrom:
        - secretRef:
            name: igait-secrets
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: 1200m
            memory: 4Gi
