[package]
name = "validity-check"
version = "0.1.0"
edition = "2021"
description = "Validity check microservice for iGait pipeline"

[[bin]]
name = "validity-check"
path = "src/main.rs"

[dependencies]
igait-lib = { path = "../../igait-lib", features = ["microservice"] }
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
